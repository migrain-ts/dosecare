# Local demo stack only: fictional data and a KNOWN demo password (SEED_DEMO=1 seeds demo users).
# All ports are bound to loopback. Never expose this stack to a network.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: dosecare
      POSTGRES_PASSWORD: dosecare
      POSTGRES_DB: dosecare
    ports: ["127.0.0.1:5440:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dosecare"]
      interval: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit
    ports: ["127.0.0.1:1026:1025", "127.0.0.1:8026:8025"]
  api:
    build: { context: ., dockerfile: docker/node.Dockerfile, args: { APP: api } }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://dosecare:dosecare@postgres:5432/dosecare
      API_PORT: 4000
      APP_URL: http://localhost:3100
      NODE_ENV: production
      INSECURE_COOKIES: "1"
      TRUST_PROXY: "1"
      SEED_DEMO: "1"
    ports: ["127.0.0.1:4000:4000"]
    depends_on: { postgres: { condition: service_healthy } }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/openapi.json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      retries: 40
  worker:
    build: { context: ., dockerfile: docker/node.Dockerfile, args: { APP: worker } }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://dosecare:dosecare@postgres:5432/dosecare
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: DoseCare <no-reply@dosecare.local>
      CYCLE_SECONDS: 10
    depends_on:
      api: { condition: service_healthy }
      mailpit: { condition: service_started }
  web:
    build: { context: ., dockerfile: docker/web.Dockerfile, args: { API_URL: "http://api:4000" } }
    restart: unless-stopped
    ports: ["127.0.0.1:3100:3000"]
    depends_on: { api: { condition: service_healthy } }
volumes:
  pgdata:

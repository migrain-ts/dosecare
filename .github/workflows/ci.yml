name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: dosecare
          POSTGRES_PASSWORD: dosecare
          POSTGRES_DB: dosecare
        ports: ["5440:5432"]
        options: >-
          --health-cmd "pg_isready -U dosecare" --health-interval 3s --health-retries 20
    env:
      TEST_ADMIN_DATABASE_URL: postgres://dosecare:dosecare@localhost:5440/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  e2e:
    runs-on: ubuntu-latest
    needs: docker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: docker compose up --build -d --wait
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        run: docker compose logs --no-color | tail -200
